<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beam Analysis Plot</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 24px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 1.5rem;
            color: #fff;
            letter-spacing: 1px;
        }

        .container { max-width: 960px; margin: 0 auto; }

        .form-card {
            background: #16213e;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 28px;
            border: 1px solid #0f3460;
        }

        table { width: 100%; border-collapse: collapse; }
        td { padding: 8px 10px; vertical-align: middle; }
        td:first-child { width: 200px; color: #a0aec0; font-size: 0.9rem; }

        select, input[type="text"] {
            background: #0f3460;
            border: 1px solid #2d4a7a;
            border-radius: 6px;
            color: #e0e0e0;
            padding: 7px 12px;
            width: 260px;
            font-size: 0.9rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #e94560;
        }

        sup { font-size: 0.7rem; color: #a0aec0; }
        hr { border: none; border-top: 1px solid #0f3460; margin: 4px 0; }

        #calculate {
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 36px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        #calculate:hover { background: #c73652; }

        .charts-grid { display: flex; flex-direction: column; gap: 24px; }

        .chart-card {
            background: #16213e;
            border-radius: 10px;
            padding: 20px 24px;
            border: 1px solid #0f3460;
        }

        .chart-card h3 {
            margin-bottom: 14px;
            font-size: 0.95rem;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        canvas { width: 100% !important; }


    </style>
</head>
<body>
    <div class="container">
        <h1>Beam Analysis</h1>

        <div class="form-card">
            <table>
                <tr>
                    <td>Condition</td>
                    <td>
                        <select id="condition">
                            <option value="simply-supported">Simply Supported</option>
                            <option value="two-span-unequal">Two Span Unequal</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Load Force (w)</td>
                    <td><input type="text" id="w" placeholder="e.g. 20"> kN/m</td>
                </tr>
                <tr>
                    <td>Primary Span (L1)</td>
                    <td><input type="text" id="primarySpan" placeholder="e.g. 4"> m</td>
                </tr>
                <tr id="row-l2">
                    <td>Secondary Span (L2)</td>
                    <td><input type="text" id="secondarySpan" placeholder="e.g. 5"> m</td>
                </tr>
                <tr><td colspan="2"><hr></td></tr>
                <tr>
                    <td>j2</td>
                    <td><input type="text" id="j2" placeholder="e.g. 2"></td>
                </tr>
                <tr>
                    <td>Bending Stiffness (EI)</td>
                    <td><input type="text" id="EI" value="3150000000000"> N·mm<sup>2</sup></td>
                </tr>
                <tr><td colspan="2"><hr></td></tr>
                <tr>
                    <td colspan="2" style="text-align: center; padding-top: 16px;">
                        <button type="button" id="calculate">Calculate</button>
                    </td>
                </tr>
            </table>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>Bending Moment</h3>
                <canvas id="bending_moment_plot"></canvas>
            </div>
            <div class="chart-card">
                <h3>Shear Force</h3>
                <canvas id="shear_force_plot"></canvas>
            </div>
            <div class="chart-card">
                <h3>Deflection</h3>
                <canvas id="deflection_plot"></canvas>
            </div>
        </div>
    </div>

    <script src="js/beam-analysis.js"></script>
    <script src="js/analysis-plotter.js"></script>
    <script>
        // Simpan instance plotter agar bisa destroy chart lama
        var plotters = {
            deflection    : new AnalysisPlotter('deflection_plot'),
            shearForce    : new AnalysisPlotter('shear_force_plot'),
            bendingMoment : new AnalysisPlotter('bending_moment_plot')
        };

        // Show/hide L2 sesuai condition
        function updateL2Visibility() {
            var condition = document.getElementById('condition').value;
            var l2row     = document.getElementById('row-l2');
            if (condition === 'two-span-unequal') {
                l2row.style.display = '';
            } else {
                l2row.style.display = 'none';
                document.getElementById('secondarySpan').value = '';
            }
        }

        document.getElementById('condition').addEventListener('change', updateL2Visibility);
        updateL2Visibility(); // panggil sekali saat halaman load

        function floatVal(id) {
            return parseFloat(document.getElementById(id).value);
        }
        function stringVal(id) {
            return document.getElementById(id).value;
        }

        document.getElementById('calculate').addEventListener('click', function () {
            var condition = stringVal('condition');
            var w         = floatVal('w');
            var L1        = floatVal('primarySpan');
            var L2        = floatVal('secondarySpan');
            var j2        = floatVal('j2');
            var EI        = floatVal('EI');

            // Validasi input
            if (isNaN(w) || isNaN(L1) || isNaN(j2) || isNaN(EI)) {
                alert('Mohon isi semua input dengan benar!');
                return;
            }
            if (condition === 'two-span-unequal' && isNaN(L2)) {
                alert('Secondary Span (L2) harus diisi untuk Two Span Unequal!');
                return;
            }

            var beam          = new Beam();
            beam.primarySpan  = L1;
            beam.secondarySpan = L2;
            beam.material     = new Material('No Name', { EI: EI, j2: j2 });

            var beamAnalysis      = new BeamAnalysis();
            var deflectionData    = beamAnalysis.getDeflection(beam, w, condition);
            var bendingMomentData = beamAnalysis.getBendingMoment(beam, w, condition);
            var shearForceData    = beamAnalysis.getShearForce(beam, w, condition);

            // Plot — instance sudah disimpan, chart lama otomatis di-destroy di dalam .plot()
            plotters.deflection.plot(deflectionData);
            plotters.shearForce.plot(shearForceData);
            plotters.bendingMoment.plot(bendingMomentData);
        });
    </script>
</body>
</html>
